name: Validate PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts/validate-pr.js
          sparse-checkout-cone-mode: false

      - name: Validate pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const validate = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/validate-pr.js`);
            await validate({ github, context, core });
