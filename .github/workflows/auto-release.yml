name: Auto Release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  production:
    name: Release
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/reusable-release.yml

    permissions:
      contents: write

    with:
      environment-name: production
      target-sha: ${{ github.event.pull_request.merge_commit_sha }}
      app-name: 0x-excali
      build-command: make production-deploy
      version-file: .version
      frontend-directory: frontend
      go-version-file: go.mod
      go-cache-dependency-path: go.sum
      node-version: "20"
      pnpm-version: "9"
      pnpm-lockfile: frontend/pnpm-lock.yaml
      linux-system-packages: build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      release-tag-mode: platform
      release-enabled: true
      release-draft: true
      generate-release-notes: true
      artifact-retention-days: 14
      platforms-json: |
        [
          {
            "id": "macos-arm64",
            "name": "macOS arm64",
            "runner_label": "macos-latest",
            "build_command": "wails build -platform darwin/arm64 -m -s -clean",
            "build_directory": "build/bin",
            "artifact_path": "build/bin/0x-excali.app",
            "artifact_platform": "macOS-arm64",
            "archive_format": "dmg"
          }
        ]
