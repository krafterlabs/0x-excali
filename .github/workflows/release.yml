name: Auto Release Pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/tag.yml
    secrets: inherit

  build:
    needs: tag
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/build.yml
    secrets: inherit
