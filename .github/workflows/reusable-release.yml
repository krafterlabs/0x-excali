name: Reusable Wails Release

on:
  workflow_call:
    inputs:
      environment-name:
        required: true
        type: string

      target-sha:
        required: true
        type: string

      app-name:
        required: true
        type: string

      build-command:
        required: true
        type: string

      version-file:
        required: false
        default: .version
        type: string

      frontend-directory:
        required: false
        default: frontend
        type: string

      go-version-file:
        required: false
        default: go.mod
        type: string

      go-cache-dependency-path:
        required: false
        default: go.sum
        type: string

      node-version:
        required: false
        default: "20"
        type: string

      pnpm-version:
        required: false
        default: "9"
        type: string

      pnpm-lockfile:
        required: false
        default: frontend/pnpm-lock.yaml
        type: string

      linux-system-packages:
        required: false
        default: build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
        type: string

      release-tag-mode:
        required: false
        default: platform
        type: string

      release-enabled:
        required: false
        default: true
        type: boolean

      release-draft:
        required: false
        default: true
        type: boolean

      generate-release-notes:
        required: false
        default: true
        type: boolean

      artifact-retention-days:
        required: false
        default: 14
        type: number

      platforms-json:
        required: false
        type: string
        default: |
          [
            {
              "id": "macos-arm64",
              "name": "macOS arm64",
              "runner_label": "macos-latest",
              "build_command": "wails build -platform darwin/arm64 -m -s -clean",
              "build_directory": "build/bin",
              "artifact_path": "build/bin/0x-excali.app",
              "artifact_platform": "macOS-arm64",
              "archive_format": "dmg"
            }
          ]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner_label }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms-json) }}

    environment:
      name: ${{ inputs.environment-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target-sha }}
          fetch-depth: 1

      - name: Read version
        id: version
        shell: bash
        run: bash .github/scripts/read-version.sh "${{ inputs.version-file }}"

      - name: Setup Wails
        uses: ./.github/actions/setup-wails
        with:
          go-version-file: ${{ inputs.go-version-file }}
          go-cache-dependency-path: ${{ inputs.go-cache-dependency-path }}
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          pnpm-lockfile: ${{ inputs.pnpm-lockfile }}

      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_SYSTEM_PACKAGES: ${{ inputs.linux-system-packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${LINUX_SYSTEM_PACKAGES}

      - name: Install frontend dependencies
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          bash .github/scripts/install-frontend-dependencies.sh \
            "${{ inputs.frontend-directory }}"

      - name: Build
        shell: bash
        env:
          BUILD_COMMAND: ${{ matrix.platform.build_command || inputs.build-command }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment-name }}
          RELEASE_PLATFORM: ${{ matrix.platform.id }}
        run: bash -Eeuo pipefail -c "${BUILD_COMMAND}"

      - name: Package
        id: package
        shell: bash
        run: |
          bash .github/scripts/package-artifact.sh \
            "${{ inputs.app-name }}" \
            "${{ inputs.environment-name }}" \
            "${{ steps.version.outputs.value }}" \
            "${{ matrix.platform.id }}" \
            "${{ matrix.platform.artifact_platform }}" \
            "${{ matrix.platform.artifact_path }}" \
            "${{ matrix.platform.archive_format }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          compression-level: 0
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error

      - name: Create release tag
        id: release-tag
        if: inputs.release-enabled
        shell: bash
        run: |
          bash .github/scripts/create-release-tag.sh \
            "${{ steps.version.outputs.value }}" \
            "${{ inputs.target-sha }}" \
            "${{ matrix.platform.id }}" \
            "${{ inputs.release-tag-mode }}"

      - name: Create release
        if: inputs.release-enabled
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: Release ${{ steps.release-tag.outputs.tag }}
          target_commitish: ${{ inputs.target-sha }}
          draft: ${{ inputs.release-draft }}
          generate_release_notes: ${{ inputs.generate-release-notes }}
          fail_on_unmatched_files: true
          files: ${{ steps.package.outputs.path }}
