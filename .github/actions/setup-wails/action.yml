name: Setup Wails

description: Setup Go, Node.js, pnpm and Wails with caching

inputs:
  go-version-file:
    required: false
    default: go.mod

  go-cache-dependency-path:
    required: false
    default: go.sum

  node-version-file:
    required: false
    default: ".nvmrc"

  pnpm-version:
    required: false
    default: "9"

  pnpm-lockfile:
    required: false
    default: frontend/pnpm-lock.yaml

runs:
  using: composite

  steps:
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: true
        cache-dependency-path: ${{ inputs.go-cache-dependency-path }}

    - name: Add Go bin to PATH
      shell: bash
      run: echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.pnpm-lockfile }}

    - name: Resolve Wails version
      id: wails
      shell: bash
      run: |
        WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
        if [[ -z "${WAILS_VERSION}" ]]; then
          echo "::error::Wails dependency was not found in go.mod"
          exit 1
        fi
        echo "version=${WAILS_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Restore Wails cache
      id: wails-cache
      uses: actions/cache/restore@v5
      with:
        path: ~/go/bin/wails
        key: wails-${{ runner.os }}-${{ runner.arch }}-${{ steps.wails.outputs.version }}

    - name: Install Wails
      if: steps.wails-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        go install "github.com/wailsapp/wails/v2/cmd/wails@${{ steps.wails.outputs.version }}"

    - name: Verify Wails
      shell: bash
      run: |
        command -v wails >/dev/null 2>&1 || {
          echo "::error::Wails executable is unavailable"
          exit 1
        }
        wails version

    - name: Save Wails cache
      if: steps.wails-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/go/bin/wails
        key: ${{ steps.wails-cache.outputs.cache-primary-key }}
