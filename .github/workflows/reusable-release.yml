name: Reusable Wails Release

on:
  workflow_call:
    inputs:
      environment-name:
        required: true
        type: string

      target-sha:
        required: true
        type: string

      app-name:
        required: true
        type: string

      build-command:
        required: true
        type: string

      version-file:
        required: false
        default: .version
        type: string

      frontend-directory:
        required: false
        default: frontend
        type: string

      go-version-file:
        required: false
        default: go.mod
        type: string

      go-cache-dependency-path:
        required: false
        default: go.sum
        type: string

      node-version-file:
        required: false
        default: .nvmrc
        type: string

      pnpm-version:
        required: false
        default: "9"
        type: string

      pnpm-lockfile:
        required: false
        default: frontend/pnpm-lock.yaml
        type: string

      linux-system-packages:
        required: false
        default: build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
        type: string

      release-tag-mode:
        required: false
        default: platform
        type: string

      release-enabled:
        required: false
        default: true
        type: boolean

      release-draft:
        required: false
        default: true
        type: boolean

      generate-release-notes:
        required: false
        default: true
        type: boolean

      artifact-retention-days:
        required: false
        default: 14
        type: number

      platforms-json:
        required: false
        type: string
        default: |
          [
            {
              "id": "macos-arm64",
              "name": "macOS arm64",
              "runner_label": "macos-latest",
              "build_command": "wails build -platform darwin/arm64 -m -s -clean",
              "build_directory": "build/bin",
              "artifact_path": "build/bin/0x-excali.app",
              "artifact_platform": "macOS-arm64",
              "archive_format": "dmg"
            }
          ]

permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner_label }}
    permissions:
      contents: read
      actions: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms-json) }}

    environment:
      name: ${{ inputs.environment-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target-sha }}
          fetch-depth: 1

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(cat "${{ inputs.version-file }}")
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Version file is empty"
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Wails
        uses: ./.github/actions/setup-wails
        with:
          go-version-file: ${{ inputs.go-version-file }}
          go-cache-dependency-path: ${{ inputs.go-cache-dependency-path }}
          node-version-file: ${{ inputs.node-version-file }}
          pnpm-version: ${{ inputs.pnpm-version }}
          pnpm-lockfile: ${{ inputs.pnpm-lockfile }}

      - name: Install Linux build dependencies
        if: matrix.platform.target == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.linux-system-packages }}

      - name: Build production ${{ matrix.platform.name }}
        id: build_script
        shell: bash
        run: ./scripts/build-production.sh --target "${{ matrix.platform.target }}" --package "${{ matrix.platform.package }}" --secure --skip-frontend-install

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: 0x-excali-${{ matrix.platform.target }}
          path: |
            ${{ steps.build_script.outputs.asset_path }}
            ${{ steps.build_script.outputs.checksum_path }}
            ${{ steps.build_script.outputs.metadata_path }}
          compression-level: 0
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [build]
    if: always() && inputs.release-enabled && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target-sha }}
          fetch-depth: 1

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(cat "${{ inputs.version-file }}")
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Version file is empty"
            exit 1
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release tag
        id: release-tag
        shell: bash
        run: |
          bash .github/scripts/create-release-tag.sh \
            "${{ steps.version.outputs.value }}" \
            "${{ inputs.target-sha }}" \
            "" \
            "${{ inputs.release-tag-mode }}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          name: Release ${{ steps.release-tag.outputs.tag }}
          target_commitish: ${{ inputs.target-sha }}
          draft: ${{ inputs.release-draft }}
          generate_release_notes: ${{ inputs.generate-release-notes }}
          fail_on_unmatched_files: false
          files: |
            artifacts/*
            LICENSE
            THIRD_PARTY_NOTICES.md
