name: Setup Wails

description: Setup Go, Node.js, pnpm and Wails with caching

inputs:
  go-version-file:
    required: false
    default: go.mod

  go-cache-dependency-path:
    required: false
    default: go.sum

  node-version:
    required: false
    default: "20"

  pnpm-version:
    required: false
    default: "9"

  pnpm-lockfile:
    required: false
    default: frontend/pnpm-lock.yaml

runs:
  using: composite

  steps:
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: true
        cache-dependency-path: ${{ inputs.go-cache-dependency-path }}

    - name: Add Go bin to PATH
      shell: bash
      run: echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.pnpm-lockfile }}

    - name: Resolve Wails version
      id: wails
      shell: bash
      run: bash .github/scripts/install-wails.sh --print-version

    - name: Restore Wails cache
      id: wails-cache
      uses: actions/cache/restore@v5
      with:
        path: ~/go/bin/wails
        key: wails-${{ runner.os }}-${{ runner.arch }}-${{ steps.wails.outputs.version }}

    - name: Install Wails
      if: steps.wails-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bash .github/scripts/install-wails.sh

    - name: Verify Wails
      shell: bash
      run: bash .github/scripts/install-wails.sh --verify

    - name: Save Wails cache
      if: steps.wails-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/go/bin/wails
        key: ${{ steps.wails-cache.outputs.cache-primary-key }}
