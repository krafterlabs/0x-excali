name: Auto Release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  production:
    name: Release
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/reusable-release.yml

    permissions:
      contents: write
      actions: write

    with:
      environment-name: production
      target-sha: ${{ github.event.pull_request.merge_commit_sha }}
      app-name: 0x-excali
      build-command: make production-deploy
      version-file: .version
      frontend-directory: frontend
      go-version-file: go.mod
      go-cache-dependency-path: go.sum
      node-version-file: .nvmrc
      pnpm-version: "11.17.0"
      pnpm-lockfile: frontend/pnpm-lock.yaml
      linux-system-packages: build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      release-tag-mode: single
      release-enabled: true
      release-draft: true
      generate-release-notes: true
      artifact-retention-days: 14
      platforms-json: |
        [
          {
            "target": "macos",
            "name": "macOS",
            "runner_label": "macos-latest",
            "package": "dmg"
          },
          {
            "target": "linux",
            "name": "Linux",
            "runner_label": "ubuntu-22.04",
            "package": "tar.gz"
          }
        ]
